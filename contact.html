<!DOCTYPE html>
<html lang = "ja">
    <head>
        <meta charset = "utf-8">
        <title>WCB Cafe - CONTACT</title>

        <link rel = "icon" type = "image/png" href = "images/favicon.png">
        <meta name = "viewport" content = "width = device-width, initial-scale=1">
        <mata property = "og:url" content = "http://example.com/index.html">
        <meta property = "og:type" content = "website">
        <meta property = "og:title" content = "WCB Cafe Home">
        <meta property = "og:description" content = "おしゃれなカフェで癒されてみませんか？無添加の食材で体の中からリフレッシュ。">

        <!-- CSS -->
        <link rel = "stylesheet" href = "https://unpkg.com/ress/dist/ress.min.css">
        <link href = "https://fonts.googleapis.com/css?family=Philosopher" rel = "stylesheet">
        <link href = "css/style.css" rel = "stylesheet">
    </head>

    <body>
        <div id = "contact" class = "big-bg">
            <!-- ヘッダー -->
            <header class = "page-header wrapper">
                <h1><a href = "index.html"><img class = "logo" src = "images/logo.svg" alt = "WCBカフェホーム"></a></h1>
                <nav>
                    <ul class = "main-nav">
                        <li><a href = "news.html">News</a></li>
                        <li><a href = "menu.html">Menu</a></li>
                        <li><a href = "contact.html">Contact</a></li>
                    </ul>
                </nav>
            </header>

            <div class = "wrapper">
                <h2 class = "page-title">Contact</h2>
                <form action = "#" method="post">
                    <div>
                        <label for = "name">お名前</label>
                        <input type = "text" id = "name" name = "your-name">
                    </div>

                    <div>
                        <label for = "e-mail">メールアドレス</label>
                        <input type = "email" id = "email" name = "your-email">
                    </div>
                    
                    <div>
                        <label for = "message">メッセージ</label>
                        <textarea id = "message" name = "your-message"></textarea>
                    </div>

                    <input type = "submit" class = "button" value = "送信">
                </form>
            </div><!-- /.wrapper -->
        </div><!-- /#contact -->

        <!-- 店舗情報・地図 -->
        <section id = "location">
            <div class = "wrapper">
                <div class = "location-info">
                    <h3 class = "sub-title">カフェ東駅前店</h3>
                    <p>
                        住所：東京都港区<br>
                        〇〇〇 000-23-1 <br>
                        △△△ <br>
                        電話 : 03-1111-1111<br>
                        営業時間 : 10:00 - 20:00<br>
                        休日 : 水曜
                    </p>
                </div><!-- /.location-info -->
                <div class = "location-map">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4039.1462565007805!2d139.73428897638001!3d35.66600573080916!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x60188b835eb8d1e9%3A0x2b7a60ac15c8822a!2z44CSMTA2LTAwMzIg5p2x5Lqs6YO95riv5Yy65YWt5pys5pyo77yS5LiB55uu77yU4oiS77yV!5e1!3m2!1sja!2sjp!4v1750171758246!5m2!1sja!2sjp" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div><!-- /.location-map -->
            </div><!-- /.wrapper -->
        </section><!-- /#location -->
        
        <section id = "sns">
            <div class = "wrapper">
                <div class = "sns-box">
                    <h3 class = "sub-title">Facebook</h3>
                    <a class="sns-qr" href="https://www.facebook.com"><img src="images/facebookqr.png" alt="facebook"></a>
                </div>

                <div class = "sns-box">
                    <h3 class = "sub-title">X</h3>
                    <a class="sns-qr" href="https://x.com/ "><img src="images/xqr.png" alt="x"></a>
                </div>

                <div class = "sns-box">
                    <h3 class = "sub-title">YouTube</h3>
                    <a class="sns-qr" href="https://www.youtube.com/"><img src="images/youtubeqr.png" alt="youtube"></a>
                </div>
            </div><!-- /.wrapper -->
        </section><!-- /#sns -->


        <!-- フッター -->
        <footer>
            <div class = "wrapper">
                <p><small>&copy; 2025 YusakuMatsuo</small></p>
